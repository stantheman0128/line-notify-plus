<h1>Notify+</h1>
<p class="tagline">Nothing Phone 上的 LINE 通知強化工具</p>
<p>Notify+ 是獨立開發的第三方工具，與 LINE Corporation、LY Corporation 無關，亦非官方產品。</p>

<h2>功能</h2>
<ul>
  <li>對話串模式 / Apple 分組模式：自選通知風格</li>
  <li>取代原始 LINE 通知：避免重複顯示</li>
  <li>個別聊天室開關：細部控制誰能打擾你</li>
  <li>快速回覆：通知列直接回覆訊息</li>
  <li>頭貼顯示：一眼辨識聯絡人</li>
</ul>

<p>即將於 Google Play 上架。</p>
